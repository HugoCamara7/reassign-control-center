# Copiar como .streamlit/secrets.toml y completar.
# NUNCA subir el archivo real al repositorio (ya esta en .gitignore).
#
# Este archivo es COMPATIBLE con los secrets de Catalogo Control Center:
# puedes pegar los mismos bloques [bigquery], [gcp_service_account] y
# [app_auth] sin editar nada. Las claves que esta app no usa se ignoran.

[bigquery]
enabled = true
project_id = "PROYECTO_DONDE_SE_EJECUTA_EL_JOB"
job_project_id = "PROYECTO_DONDE_SE_EJECUTA_EL_JOB"
# location = "US"

# OJO: en Catalogo Control Center la clave `table` apunta a la tabla ARTI
# (maestro de productos), NO al stock. Esta app la ignora a proposito.
# El stock sale siempre de `stock_table`; si se omite, se usa la tabla de
# siempre: forus-analitica-prod-datalake.bronze.stg_pe_central_stock_bi
# stock_table = "forus-analitica-prod-datalake.bronze.stg_pe_central_stock_bi"

# Opcional: reemplaza la consulta de stock por una propia.
# Debe devolver, con cualquiera de estos nombres:
#   sku | id_producto        -> codigo del producto
#   cod_tienda | codigo_tienda -> codigo de bodega/tienda
#   stock_tiendas, stock_bodega, fecha_corte
# Si incluye el parametro @skus (ARRAY<STRING>), la app consulta por lotes.
# Si no lo incluye, ejecuta la consulta completa una vez y filtra en memoria.
# Puede usar {table} como marcador de la tabla.
# stock_query = """..."""

[gcp_service_account]
type = "service_account"
project_id = "TU_PROJECT_ID"
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "tu-service-account@tu-project.iam.gserviceaccount.com"
client_id = "..."
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "..."

# Login opcional. Si se omite la seccion completa, la app queda abierta.
# Mismo formato que Catalogo Control Center: un solo usuario...
[app_auth]
username = "admin"
password = "CAMBIAR_ESTA_CLAVE"

# ...o varios:
# [app_auth.users]
# "hugo.camara@forus.pe" = "CAMBIAR_ESTA_CLAVE"
# "luis.nunez@forus.pe" = "CAMBIAR_ESTA_CLAVE"
